# Description:
# This file supplies BLE GATT parameters used at runtime for Secora wearable
# pairing and communication, including:
#   - primary GATT service UUID (BLE_SERVICE_UUID)
#   - client characteristic configuration descriptor UUID (BLE_CCCD_UUID)
#   - request characteristic UUID (BLE_REQUEST_UUID)
#   - response characteristic UUID (BLE_RESPONSE_UUID)
#   - BLE scan / discovery list: device names must start with
#     BLE_DEVICE_NAME_DISCOVERY_FILTER_PATTERN (substring prefix match).
# Avoid committing sensitive or production-only values if restricted by internal
# security policies.

BLE_SERVICE_UUID=78133E8A-6D72-45A2-8302-BEF15B865784
BLE_CCCD_UUID=00002902-0000-1000-8000-00805f9b34fb
BLE_REQUEST_UUID=DEA23C9B-3518-4BD9-A672-0AA38AD65F8D
BLE_RESPONSE_UUID=8619C551-2A4A-4BB3-9593-BF7397B79DE7

# device names must start with
BLE_DEVICE_NAME_DISCOVERY_FILTER_PATTERN=SECORA
